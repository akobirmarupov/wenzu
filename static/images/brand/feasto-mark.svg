<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Feasto">
  <title>Feasto</title>
  <defs>
    <!-- Logotipdagi to'q-och to'q sariq o'tishi: pastdan yuqoriga ochiladi. -->
    <linearGradient id="feasto-f" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#DB4C15"/>
      <stop offset="1" stop-color="#F7902A"/>
    </linearGradient>
    <linearGradient id="feasto-dome" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D9451A"/>
      <stop offset="1" stop-color="#F0762A"/>
    </linearGradient>
  </defs>

  <!-- "F" harfi: tik ustun va ikkita yotiq qo'l.
       Pastki chap burchak kattaroq radius bilan — logotipdagi
       barg shakliga ishora. -->
  <g fill="url(#feasto-f)">
    <path d="M14 20a6 6 0 0 1 6-6h6v34a12 12 0 0 1-12 12z"/>
    <rect x="14" y="14" width="32" height="12" rx="6"/>
    <rect x="14" y="31" width="25" height="12" rx="6"/>
  </g>

  <!-- Qopqoq (cloche). Oq hoshiya uni "F" ustida ajratib turadi —
       aks holda ikkita to'q sariq shakl bir-biriga qo'shilib ketardi. -->
  <g stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <path fill="url(#feasto-dome)" d="M30 34a13 13 0 0 1 26 0z"/>
    <rect fill="url(#feasto-dome)" x="27" y="33.5" width="32" height="4.5" rx="2.25"/>
    <circle fill="url(#feasto-dome)" cx="43" cy="19" r="2.8"/>
  </g>
  <!-- Qopqoqdagi yorug'lik chizig'i. -->
  <path d="M35 31.5a8.5 8.5 0 0 1 6-7.5" fill="none" stroke="#FFF1E4"
        stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <!-- Bug' — o'ng yuqorida ikkita S-to'lqin.
       Qisqa yoy qo'shtirnoqqa o'xshab qolardi; ikki tomonga egilgan
       uzunroq chiziq esa ko'tarilayotgan bug'ni beradi. -->
  <g fill="none" stroke="#F0762A" stroke-width="3" stroke-linecap="round">
    <path d="M50.5 18.5c3.6-2.4 3.4-5.2 1-7.3-2.4-2-2.6-4.3.4-6.2"/>
    <path d="M58 15c3.2-2.2 3-4.7.9-6.6-2.1-1.8-2.3-3.8.4-5.5"/>
  </g>
</svg>
