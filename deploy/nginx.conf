# ===================================================================
# Feasto — nginx sozlamasi
#
# Joyi:  /etc/nginx/sites-available/feasto
# Ulash: ln -s /etc/nginx/sites-available/feasto /etc/nginx/sites-enabled/
#
# Nginx uchta ish qiladi:
#   1. HTTPS ni yopadi va butun trafikni shifrlaydi;
#   2. statik va media fayllarni O'ZI beradi — Django ularga umuman
#      tegmaydi (`config/urls.py` da ular faqat DEBUG da beriladi);
#   3. qolgan hamma so'rovni gunicorn'ga uzatadi.
# ===================================================================

# --- So'rov cheklovi (nginx darajasida, Django'dagidan tashqari) ---
#
# Django'da ham throttling bor, lekin u so'rov ILOVAGACHA yetib
# kelgandan keyin ishlaydi. Kirish sahifasiga bo'lgan hujumni shu
# yerda, ilovaga yetib bormasdan to'xtatgan arzonroq.
limit_req_zone $binary_remote_addr zone=feasto_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=feasto_api:10m rate=120r/m;

# Gunicorn — unix soket orqali. TCP'ga qaraganda tezroq va portni
# tashqariga ochmaydi.
upstream feasto_app {
    server unix:/run/feasto/gunicorn.sock fail_timeout=0;
}

# --- 1. HTTP: hamma narsani HTTPS ga yo'naltiradi ---
server {
    listen 80;
    listen [::]:80;
    server_name feasto.uz www.feasto.uz;

    # Certbot sertifikatni yangilash uchun shu yo'lni TEKSHIRADI —
    # uni yo'naltirishdan oldin qo'yish shart, aks holda avtomatik
    # yangilanish ishlamay qoladi va sertifikat 90 kunda tugaydi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://feasto.uz$request_uri;
    }
}

# --- 2. www: apex domenga yo'naltiradi ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.feasto.uz;

    ssl_certificate     /etc/letsencrypt/live/feasto.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feasto.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://feasto.uz$request_uri;
}

# --- 3. Asosiy sayt ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feasto.uz;

    ssl_certificate     /etc/letsencrypt/live/feasto.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feasto.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rasm yuklash chegarasi. Django'da 10 MB (`DATA_UPLOAD_MAX_MEMORY_SIZE`),
    # bitta rasm esa 5 MB (`common/validators.py`). Nginx biroz KATTAROQ
    # bo'lishi kerak: aks holda foydalanuvchi Django'ning tushunarli
    # xatosi o'rniga nginx'ning quruq "413" sahifasini ko'rardi.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Xavfsizlik sarlavhalarini Django o'zi qo'yadi (HSTS, nosniff,
    # X-Frame-Options, Referrer-Policy) — bu yerda takrorlanmaydi.
    # Takrorlansa ikkita bir xil sarlavha ketadi va ba'zi brauzerlar
    # ularni ziddiyat deb hisoblaydi.

    # --- siqish ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/rss+xml image/svg+xml
        application/manifest+json font/woff font/woff2;

    access_log /var/log/nginx/feasto.access.log;
    error_log  /var/log/nginx/feasto.error.log warn;

    # --- statik fayllar ---
    #
    # `collectstatic` xeshlangan nusxalarni ham yasaydi
    # (`app.a1b2c3.js`). Ular hech qachon o'zgarmaydi, shuning uchun
    # bir yillik kesh xavfsiz. Xeshsiz nusxalar esa ES modul
    # importlari uchun kerak — ularga qisqa kesh beriladi.
    location /static/ {
        alias /srv/feasto/staticfiles/;
        access_log off;

        # Xeshlangan fayl — abadiy kesh.
        location ~* "\.[0-9a-f]{12}\.(css|js|woff2?|png|jpg|jpeg|svg|webp)$" {
            alias /srv/feasto/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        expires 1h;
        add_header Cache-Control "public";
    }

    # --- foydalanuvchi yuklagan fayllar ---
    #
    # MUHIM: bu yerda skript ISHLAMASLIGI kerak. Kimdir ".jpg" niqobi
    # ostida bajariladigan fayl yuklasa ham, nginx uni faqat fayl
    # sifatida beradi.
    location /media/ {
        alias /srv/feasto/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # --- kirish/ro'yxatdan o'tish: qattiqroq cheklov ---
    location /api/auth/ {
        limit_req zone=feasto_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/feasto_proxy.conf;
    }

    # --- qolgan API ---
    location /api/ {
        limit_req zone=feasto_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/feasto_proxy.conf;
    }

    # --- sahifalar ---
    location / {
        include /etc/nginx/feasto_proxy.conf;
    }

    # Bu fayllar ilova ishiga aloqador emas — loglarni tozalab turadi.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
