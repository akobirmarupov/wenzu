# ===================================================================
# Gunicorn'ga uzatishning umumiy qismi.
# Joyi: /etc/nginx/feasto_proxy.conf
#
# Alohida fayl, chunki u to'rtta `location` da takrorlanadi. Bir
# joyda turgani sarlavhalardan birini unutib qo'yishning oldini oladi.
# ===================================================================

proxy_pass http://feasto_app;

proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# BUSIZ SAYT ISHLAMAYDI. Django `SECURE_SSL_REDIRECT=True` bilan har
# bir so'rovni HTTPS ga yo'naltiradi; proksi orqasida esa u so'rovni
# HTTP deb ko'radi va o'zini o'ziga cheksiz yo'naltirib, "ERR_TOO_MANY_
# REDIRECTS" beradi. Shu sarlavha unga haqiqiy sxemani aytadi
# (`SECURE_PROXY_SSL_HEADER`, config/settings.py).
proxy_set_header X-Forwarded-Proto $scheme;

proxy_redirect off;
proxy_buffering on;
proxy_read_timeout 75s;     # gunicorn timeout (60s) dan KATTA bo'lsin
proxy_connect_timeout 10s;
