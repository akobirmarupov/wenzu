{% load static %}{# Yuqori panel — til, tema va foydalanuvchi o'ng burchakda #}
<header class="topbar">
  <button class="icon-btn topbar-burger" type="button" data-nav-toggle aria-label="Menyu"><svg class="ico" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  <a class="topbar-brand" href="/"><img class="brand-mark" src="{% static 'images/brand/feasto-mark.svg' %}" alt="" width="28" height="28">Feasto</a>

  {% if page_title %}<h1 class="topbar-title"{% if page_title_key %} data-i18n="{{ page_title_key }}"{% endif %}>{{ page_title }}</h1>{% endif %}

  <div class="topbar-right" id="topbar-right"></div>
</header>
