{% extends "layouts/dashboard.html" %}
{% load static %}

{% block dashboard_content %}
<div class="panel">
  <div class="panel-head">
    <div class="stack stack-1">
      <h2 class="display h3">Foydalanuvchilar</h2>
      <span class="small muted" id="user-count">&nbsp;</span>
    </div>
    <div class="filter-bar">
      <label class="search"><span><svg class="ico" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <input id="q" placeholder="Ism, username yoki telefon" aria-label="Qidiruv"></label>
      <div class="row row-2" id="role-filters"></div>
    </div>
  </div>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Ism</th><th>Username</th><th>Telefon</th><th>Rol</th><th>Ishonchlilik</th><th>Holat</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table></div>
  <div id="pager"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/pages/admin/users.js' %}?v={{ asset_version }}"></script>
{% endblock %}
