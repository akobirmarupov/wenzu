{% extends "layouts/dashboard.html" %}
{% load static %}

{% block dashboard_content %}
<div class="panel">
  <div class="panel-head">
    <h2 class="display h3">Barcha bronlar <span class="count-pill" id="total">0</span></h2>
    <div class="filter-bar">
      <label class="field" style="min-width:180px">
        <span class="field-hint">Sanadan boshlab</span>
        <input class="input" id="date-from" type="date" aria-label="Sanadan boshlab">
      </label>
      <div class="row row-2" id="type-filters"></div>
    </div>
  </div>

  <div class="row row-2" id="status-filters" style="margin-bottom:var(--sp-4)"></div>

  <div class="table-wrap"><table class="table">
    <thead><tr>
      <th>Joy</th><th>Mijoz</th><th>Qachon</th>
      <th class="right">Mehmon</th><th class="right">Summa</th><th class="right">Holat</th>
    </tr></thead>
    <tbody id="list"></tbody>
  </table></div>
  <div id="pager"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/pages/admin/reservations.js' %}?v={{ asset_version }}"></script>
{% endblock %}
