{% extends "layouts/dashboard.html" %}
{% load static %}

{% block dashboard_content %}
<div class="panel">
  <div class="panel-head">
    <div class="stack stack-1">
      <h2 class="display h3">Bizneslar</h2>
      <span class="small muted">Ochish, tahrirlash, bloklash va o'chirish — hammasi shu yerda.</span>
    </div>
    <div class="filter-bar">
      <label class="search"><span><svg class="ico" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <input id="q" placeholder="Nomi yoki tuman" aria-label="Qidiruv"></label>
      <div class="row row-2" id="type-filters"></div>
      <button class="btn btn-primary btn-sm" type="button" id="add-business">+ Biznes ochish</button>
    </div>
  </div>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Nomi</th><th>Turi</th><th>Egasi</th><th>Obuna</th><th>Holat</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table></div>
  <div id="pager"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/pages/admin/businesses.js' %}?v={{ asset_version }}"></script>
{% endblock %}
