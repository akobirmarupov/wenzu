{% extends "layouts/dashboard.html" %}
{% load static %}

{% block dashboard_content %}
<div class="grid grid-4" id="stats"></div>

<div class="panel">
  <div class="panel-head">
    <div class="stack stack-1">
      <h2 class="display h3">So'nggi bronlar</h2>
      <span class="small muted">Kutilayotganini shu yerdayoq tasdiqlashingiz mumkin.</span>
    </div>
    <a class="btn btn-ghost btn-sm" href="/panel/bronlar/">Barchasi <svg class="ico" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg></a>
  </div>
  <div id="recent"></div>
</div>

<div class="panel" id="business-card"></div>

<div class="panel">
  <div class="panel-head"><h2 class="display h3">Bo'limlar</h2></div>
  <div class="grid grid-auto-sm" id="quick-links"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/pages/owner/overview.js' %}?v={{ asset_version }}"></script>
{% endblock %}
